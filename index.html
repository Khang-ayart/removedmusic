<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removed Music - MR Removed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <div class="container">
        <h1>🎵 Removed Music</h1>
        <p class="subtitle">Tách Vocal & Music ngay trên trình duyệt</p>

        <label for="fileInput" class="custom-file-upload">
            📁 Chọn file nhạc
        </label>
        <input type="file" id="fileInput" accept="audio/*">
        <p id="fileName">Chưa chọn file nào</p>

        <div class="opt-group">
            <label for="modeSelect">Chế độ tách</label>
            <select id="modeSelect">
                <option value="advanced" selected>Nâng cao (khuyên dùng cho nhạc MV)</option>
                <option value="basic">Cơ bản (Mid/Side, nhanh)</option>
            </select>
        </div>
        <div id="advOptions" class="opt-box">
            <div class="opt-group">
                <label for="strengthSelect">Mức tách</label>
                <select id="strengthSelect">
                    <option value="nhe">Nhẹ (giữ nhiều nhạc, ít lỗi)</option>
                    <option value="canbang" selected>Cân bằng</option>
                    <option value="manh">Mạnh (sạch nhạc hơn, dễ méo)</option>
                </select>
            </div>
            <div class="opt-group">
                <label><input type="checkbox" id="cleanupChk" checked> ✨ Làm sạch vocal (EQ, lọc ồn, nén)</label>
                <select id="cleanupPreset">
                    <option value="nhe">Nhẹ</option>
                    <option value="vua" selected>Vừa</option>
                    <option value="manh">Mạnh</option>
                </select>
            </div>
            <p class="hint">Chạy ngay trên máy, không dùng AI, không tải gì lên mạng. Kết quả tốt hơn Cơ bản nhưng không bằng AI chuyên dụng.</p>
        </div>

        <button id="processBtn" disabled>⚡ Bắt đầu tách nhạc</button>
        <button id="cancelBtn" hidden class="secondary">⏹ Huỷ</button>
        <progress id="progressBar" max="1" value="0" hidden></progress>

        <div id="status" class="status"></div>

        <div id="abPanel" class="ab-panel" style="display:none;">
            <h3>🎧 Nghe so sánh</h3>
            <div class="ab-modes">
                <button type="button" data-ab="orig">Gốc</button>
                <button type="button" data-ab="raw">Vocal</button>
                <button type="button" data-ab="clean">Vocal sạch</button>
                <button type="button" data-ab="music">Nhạc</button>
            </div>
            <input type="range" id="abSeek" min="0" max="1000" value="0">
            <button type="button" id="abPlayBtn">▶️ Nghe</button>
            <label class="hint"><input type="checkbox" id="abLevel" checked> Cân bằng âm lượng khi so sánh</label>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="slider-group">
                <label>🎤 Vocal: <span id="vocalVal">100%</span></label>
                <input type="range" id="vocalSlider" min="0" max="100" value="100">
            </div>
            <div class="slider-group">
                <label>🎸 Music: <span id="musicVal">100%</span></label>
                <input type="range" id="musicSlider" min="0" max="100" value="100">
            </div>
            <button id="playBtn">▶️ Play / Pause</button>
            <button id="downloadBtn" style="background:#03dac6; margin-top:10px;">💾 Tải Vocal (MR Removed)</button>
<button id="downloadMusicBtn" style="background:#bb86fc; margin-top:10px;">🎸 Tải Music (Instrumental)</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="advanced.js"></script>
</body>
</html>
